server {
  listen 8080;
  listen [::]:8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_proxied any; # requests arrive via Fly's proxy, which nginx would otherwise refuse to compress
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # Vite fingerprints everything under /assets, so it can be cached forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # the shell must always be fresh so new deploys are picked up
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files $uri $uri/ /index.html;
  }
}
