# Fly.io deployment for FluidLab — a static bundle served by nginx.
# First time:  fly launch --copy-config --no-deploy   (pick a unique app name + region)
# Afterwards:  fly deploy
app = 'fluidlab'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = 'GET'
    path = '/'
    interval = '30s'
    timeout = '5s'
    grace_period = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
